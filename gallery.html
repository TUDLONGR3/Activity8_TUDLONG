<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — TUDLONG CREATIVES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        
        body {
            background: url('https://asianews.network/wp-content/uploads/bfi_thumb/Philippine-Navy-25Sept2023-7doik08gyng36huo55rw6lwppz64mluxhnehla6bvpc.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            line-height: 1.4;
            min-height: 90vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90%;
            background-color: rgba(0, 0, 0, 0.65);
            z-index: -1;
            
        }
        
        header {
            background-color: rgba(250, 250, 250, 0.95);
            padding: 1.5rem 5%;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 4px solid #767fcc;
            position: relative;
            z-index: 20;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #497ad4, #f4d03f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
        }
        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2c2c2c;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        nav {
            background-color: rgba(192, 182, 182, 0.95);
            padding: 1rem 0;
            position: relative;
            z-index: 10;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        nav a:hover, nav a.active {
            color: #7170b9;
        }
        
        main {
            padding: 3rem 5%;
            display: flex;
            justify-content: center;
        }
        .content-card {
            background-color: rgba(253, 253, 253, 0.96);
            padding: 1rem 1rem;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 90%;
            text-align: center;
        }
        
        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            color: #2c2c2c;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .gallery-item {
            background-color: #e9e9e9;
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-weight: 500;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.03);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        
        
        
        footer {
            background-color: rgba(0, 0, 0, 0.9);
            color: #ffffff;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            nav ul { gap: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .gallery-grid { grid-template-columns: 1fr; }
            
        }
    </style>
</head>
<body>
    
    <header>
        <div class="logo">PS</div>
        <span class="brand-name">TUDLONG CREATIVES</span>
        

    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="content-card">
            <div>   
            
            </div>
            <h1>My Gallery</h1>
            <p style="color:#555; margin-bottom:1rem;">PICTURES</p>
            <div class="gallery-grid">
                <img src="bestfriends.jpeg" alt="bestfriends" class="card-img">
                <img src="NAVY.png" alt="NAVY" class="card-img">
                <img src="MISSTEEN.jpeg" alt="MISSTEEN" class="card-img">
                <img src="MAGALONG.JPG" alt="MAGALONGG" class="card-img">
                <img src="GRADUATE.jpg" alt="GRADUATE" class="card-img">
                <img src="FRIENDS.jpeg" alt="FRIENDS" class="card-img">
            </div>
        </div>
        
    </main>
    
    <footer>
        © 2026 TUDLONG CREATIVES — All Rights Reserved
    </footer>
    
</body>
</html>
